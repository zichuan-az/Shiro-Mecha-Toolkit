name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      draft:
        description: 'Create a draft release'
        required: false
        default: 'true'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            artifact: windows
          - os: ubuntu-latest
            target: --linux
            artifact: linux
          - os: macos-latest
            target: --mac
            artifact: macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build renderer
        run: npm run build

      - name: List build output
        shell: bash
        run: ls -la dist

      # macOS 上同时产出 arm64 与 x64，方便 Intel 机器使用
      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win --x64 --publish never

      - name: Package (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux --x64 --publish never

      - name: Package (macOS)
        if: matrix.os == 'macos-latest'
        run: npx electron-builder --mac --x64 --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShiroMechaToolkit-${{ matrix.artifact }}
          path: |
            release/*.exe
            release/*.blockmap
            release/*.AppImage
            release/*.dmg
            release/*.zip
            release/latest*.yml
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifact folders
        run: |
          mkdir -p dist-release
          find artifacts -type f \( -name '*.exe' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.blockmap' -o -name 'latest*.yml' \) -exec cp {} dist-release/ \;
          ls -la dist-release

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Shiro Mecha Toolkit ${{ github.ref_name }}
          draft: ${{ github.event.inputs.draft || 'false' }}
          generate_release_notes: true
          files: dist-release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
